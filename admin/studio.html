<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio · WBAI 99.5 FM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1c1615" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/assets/icon-256.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/studio.css">
<script src="/theme-boot.js"></script>
</head>
<body class="studio-body">

<header class="studio-bar">
  <div class="studio-bar-inner">
    <h1 class="studio-brand">
      <span class="studio-brand-name">Studio</span>
      <span class="studio-brand-station" id="station">wbai</span>
    </h1>
    <div class="studio-bar-actions">
      <!-- Same markup and behaviour as the listener app's toggle: the icon is
           driven entirely by the --sun token in styles.css, so it is already
           correct on the first paint, before studio.js has run. -->
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <mask id="themeMoonMask">
            <rect x="-4" y="-4" width="32" height="32" fill="#fff"/>
            <circle class="theme-icon-bite" cx="18" cy="7" r="8" fill="#000"/>
          </mask>
          <circle class="theme-icon-orb" cx="12" cy="12" r="9" mask="url(#themeMoonMask)"/>
          <g class="theme-icon-rays">
            <line x1="12" y1="1"    x2="12"   y2="3"/>
            <line x1="12" y1="21"   x2="12"   y2="23"/>
            <line x1="1"  y1="12"   x2="3"    y2="12"/>
            <line x1="21" y1="12"   x2="23"   y2="12"/>
            <line x1="4.2"  y1="4.2"  x2="5.7"  y2="5.7"/>
            <line x1="18.3" y1="18.3" x2="19.8" y2="19.8"/>
            <line x1="4.2"  y1="19.8" x2="5.7"  y2="18.3"/>
            <line x1="18.3" y1="5.7"  x2="19.8" y2="4.2"/>
          </g>
        </svg>
      </button>
      <button class="studio-btn studio-btn--quiet" id="logout" type="button">Sign out</button>
    </div>
  </div>
</header>

<main class="studio-main" id="main" aria-busy="true">

  <!-- Phase 1 is the gate, not the dashboard. What is behind it is deliberately
       plain: enough to prove a session works and to answer the operational
       questions we already have answers for. The stats app is Phase 2. -->

  <section class="studio-section">
    <h2 class="studio-h2">Storage</h2>
    <p class="studio-note">
      Whether this deployment keeps its data across a redeploy. The only field
      that proves it is the instance id staying the same across two deploys.
    </p>
    <div class="studio-verdict" id="storageVerdict" data-state="unknown">
      <span class="studio-verdict-dot" aria-hidden="true"></span>
      <span class="studio-verdict-text" id="storageVerdictText">Checking…</span>
    </div>
    <dl class="studio-facts" id="storageFacts"></dl>
  </section>

  <section class="studio-section">
    <h2 class="studio-h2">Content held</h2>
    <dl class="studio-facts" id="countFacts"></dl>
  </section>

  <section class="studio-section">
    <h2 class="studio-h2">Feed harvest</h2>
    <dl class="studio-facts" id="feedFacts"></dl>
  </section>

  <section class="studio-section">
    <h2 class="studio-h2">Build</h2>
    <dl class="studio-facts" id="buildFacts"></dl>
  </section>

  <p class="studio-error" id="loadError" role="alert" hidden></p>
</main>

<script src="/studio.js"></script>
</body>
</html>

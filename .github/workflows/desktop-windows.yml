name: Desktop (Windows)

# Builds the Tauri shell for Windows. macOS is built locally (`npm run build`
# in desktop/) because it needs signing on the developer's own machine; adding
# it here is a one-line matrix change once that's sorted.
#
# One station per run. `station` picks the profile in
# desktop/src-tauri/stations/, which supplies the product name, bundle
# identifier and copyright; STATION_URL is that station's own deployment. Both
# are baked in at compile time.

on:
  workflow_dispatch:
    inputs:
      station:
        description: "Station profile in desktop/src-tauri/stations (slug, no .json)"
        required: true
        default: "wbai"
        type: string
      app_url:
        description: "URL the app window loads (e.g. https://archive.example.org)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Resolve station and target URL
        id: cfg
        shell: bash
        run: |
          # Manual runs pass a station in the input box. A tag push has no
          # input, so it builds this default. One station is not worth a
          # repository variable; change the line when there's a reason to.
          STATION="${{ inputs.station }}"
          if [ -z "$STATION" ]; then STATION="wbai"; fi

          PROFILE="desktop/src-tauri/stations/$STATION.json"
          if [ ! -f "$PROFILE" ]; then
            echo "::error::No station profile at $PROFILE. Available: $(ls desktop/src-tauri/stations/*.json | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi

          URL="${{ inputs.app_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.STATION_URL }}"; fi
          if [ -z "$URL" ]; then
            echo "::error::No app URL. Set the repository variable STATION_URL, or run this workflow manually and supply one."
            exit 1
          fi

          # The window title comes from the profile's productName, so the two
          # never drift apart.
          NAME=$(node -e "process.stdout.write(require('./$PROFILE').productName || 'Station Archive')")

          echo "station=$STATION" >> "$GITHUB_OUTPUT"
          echo "value=$URL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building $NAME ($STATION) against $URL"

      # --bundles nsis overrides bundle.targets in tauri.conf.json, which also
      # lists the macOS-only dmg and app targets. Naming the one target this
      # runner can actually produce keeps the build from depending on how the
      # bundler treats the other two on Windows.
      - name: Build
        working-directory: desktop
        env:
          STATION_URL: ${{ steps.cfg.outputs.value }}
          STATION_NAME: ${{ steps.cfg.outputs.name }}
        run: npm run build -- --bundles nsis --config stations/${{ steps.cfg.outputs.station }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: station-archive-windows-${{ steps.cfg.outputs.station }}
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      # No Cargo.lock is committed, so every run resolves Tauri 2.x afresh — an
      # upstream release can break a build with no change here. Download this
      # from the first green run and commit it; then the build is reproducible
      # and Swatinem/rust-cache gets a real cache key.
      - name: Upload resolved Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          if-no-files-found: warn
          path: desktop/src-tauri/Cargo.lock

name: Feed scan

# Watches WBAI's archive for changes that would break this site, once a day.
#
# The failure it exists to catch actually happened on 2026-07-29: archive2 began
# rendering a podcast XML button on 21 shows whose feeds returned 404, and the
# server was deciding what to publish from that button. Fourteen invented
# "A Mansion for the Rat" episodes appeared on the live site, one of them second
# from the top. It was found by a human looking at the page.
#
# scan.js checks each show's feed directly rather than believing the listing, so
# it sees that class of change the day it happens.
#
# Runs here rather than on a laptop because this repo lives under ~/Desktop,
# which macOS protects: a cron or launchd job cannot read it without being
# granted Full Disk Access to /bin/sh — a wildly disproportionate permission for
# a script that reads one public website. GitHub has no such problem, and it runs
# whether or not anyone's machine is awake.

on:
  schedule:
    # 09:17 UTC daily. Off the hour on purpose — GitHub's scheduler queues
    # heavily at :00 and delays are common there.
    - cron: '17 9 * * *'
  workflow_dispatch:      # "Run workflow" button, for checking on demand

permissions:
  contents: read

concurrency:
  group: feed-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # scan.js needs global fetch (18+). No dependencies to install.

      # The scanner reports what CHANGED, so it needs to remember the last run.
      # A rolling cache key with restore-keys means each run restores the newest
      # previous state and saves a fresh one. If the cache is ever evicted the
      # next run simply re-baselines and reports nothing — safe, not wrong.
      - name: Restore previous scan state
        uses: actions/cache/restore@v5
        with:
          path: test/feed-scan/state.json
          key: feed-scan-state-${{ github.run_id }}
          restore-keys: feed-scan-state-

      - name: Scan
        id: scan
        run: |
          set +e
          OUT=$(node test/feed-scan/scan.js 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo '## WBAI feed scan'
            echo
            if [ $CODE -eq 0 ]; then echo 'Nothing notable upstream. Routine churn, if any, is listed below.'
            elif [ $CODE -eq 1 ]; then echo '**Something notable changed upstream — see below.**'
            else echo '**The scan itself failed.** A scanner that has stopped working looks exactly like a quiet one, so this is treated as a failure too.'
            fi
            echo
            echo '```'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # The lines worth surfacing as annotations, so a failure is diagnosable
          # from the Annotations column / failure email without opening the job
          # summary. Exit 1: the NOTABLE change lines themselves (4-space indented,
          # named per scan.js's NOTABLE set). Exit 2+: the scanner's own error line.
          {
            echo 'detail<<SCAN_DETAIL_EOF'
            if [ $CODE -eq 1 ]; then
              printf '%s\n' "$OUT" \
                | grep -E '^ {4}(CAP_CHANGED|CLAIM_MISMATCH|FEED_DELISTED|FEED_LOST|SLUG_GONE)\b' \
                | sed 's/^ *//'
            elif [ $CODE -ge 2 ]; then
              printf '%s\n' "$OUT" | grep -E '^scan(:| failed:)' || printf '%s\n' "$OUT" | tail -3
            fi
            echo 'SCAN_DETAIL_EOF'
          } >> "$GITHUB_OUTPUT"
          exit 0

      # Saved even when the scan reports changes, so tomorrow diffs against today
      # and a standing change is not re-reported every single day.
      - name: Save scan state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: test/feed-scan/state.json
          key: feed-scan-state-${{ github.run_id }}

      # Failing the job is the notification: GitHub emails the repo owner when a
      # scheduled workflow fails, with no tokens, secrets or extra permissions.
      # A quiet day passes silently and sends nothing.
      #
      # scan.js exits 1 only for the NOTABLE change kinds. New episodes and moving
      # item counts are the archive working, sixty-odd of them in an ordinary week;
      # mailing those would be a daily failure notice, and a daily failure notice
      # is one nobody reads on the day the feeds die. The summary above still lists
      # them, so a green run is visibly green rather than merely quiet.
      - name: Report
        if: steps.scan.outputs.code != '0'
        env:
          DETAIL: ${{ steps.scan.outputs.detail }}
        run: |
          echo "Feed scan exit ${{ steps.scan.outputs.code }} — see the job summary."
          # One ::error:: per line so each notable change (or the scanner's own
          # failure message) shows up individually in the Annotations column and
          # the failure email — not just the generic "exit code 1". Passed through
          # an env var rather than interpolated into the script, since this is
          # scan.js's dynamic output.
          if [ -n "$DETAIL" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done <<< "$DETAIL"
          fi
          exit 1
